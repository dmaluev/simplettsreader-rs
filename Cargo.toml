[package]
name = "simplettsreader"
version = "2.0.1"
authors = ["Dmitry Maluev <dmaluev@gmail.com>"]
edition = "2024"
description = "Simple TTS Reader is a small clipboard reader"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
strip = true

[dependencies]
arboard = "3.6.1"
chrono = "0.4.41"
clipboard-master = "3.1.3"
confy = "0.6.1"
hound = "3.5.1"
ogg-opus = "0.1.2"
open = "5.3.2"
parking_lot = "0.12.4"
pico-args = "0.5.0"
sapi-lite = "0.1.1"
serde = { version = "1.0.219", features = ["derive"] }
single-instance = "0.3.3"
slint = { version = "1.13.0", features = ["image-default-formats", "renderer-skia", "unstable-winit-030"] }
tray-icon = "0.21.1"
vorbis-encoder = "0.1.4"
windows = { version = "0.28", features = ["Win32_System_Com"] }

[build-dependencies]
embed-resource = "3.0.5"
slint-build = "1.13.0"
