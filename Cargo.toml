[package]
name = "simplettsreader"
version = "2.0.4"
authors = ["Dmitry Maluev <dmaluev@gmail.com>"]
edition = "2024"
description = "Simple TTS Reader: A small clipboard reader"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
strip = true

[dependencies]
arboard = "3.6.1"
chrono = "0.4.44"
clipboard-master = "4.0.0"
confy = "2.0.0"
hound = "3.5.1"
log = "0.4.29"
ogg-opus = "0.1.2"
open = "5.3.4"
parking_lot = "0.12.5"
pico-args = "0.5.0"
sapi-lite = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
simplelog = "0.12.2"
single-instance = "0.3.3"
slint = { version = "1.16.1", features = ["image-default-formats", "unstable-winit-030"] }
tray-icon = "0.24.0"
vorbis-encoder = "0.1.4"
windows = "0.28"
winrt-toast = "0.1.1"

[build-dependencies]
embed-resource = "3.0.9"
slint-build = "1.16.1"
